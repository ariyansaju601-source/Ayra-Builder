name: 🤖 AYRA Auto Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Unzip & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Find & Extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" | grep -v ".git" | head -1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP found - using repo files directly"
          else
            echo "✅ Found ZIP: $ZIP"
            mkdir -p /tmp/ayra_extracted
            unzip -o "$ZIP" -d /tmp/ayra_extracted/
            ROOT=$(find /tmp/ayra_extracted -maxdepth 4 -name "settings.gradle" | head -1 | xargs dirname)
            echo "Project root: $ROOT"
            cp -r "$ROOT"/. $GITHUB_WORKSPACE/
            ls $GITHUB_WORKSPACE/
          fi

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Fix Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper

          # Download gradle-wrapper.jar
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.1.1/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          # Create/overwrite wrapper properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "gradle-wrapper.jar size: $(ls -lh gradle/wrapper/gradle-wrapper.jar)"

      - name: 🔧 Fix gradlew
        run: |
          if [ ! -f gradlew ]; then
            curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.1.1/gradlew" -o gradlew
          fi
          chmod +x gradlew

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 🎨 Create Lottie Assets
        run: |
          mkdir -p app/src/main/assets
          LOTTIE='{"v":"5.5.7","fr":30,"ip":0,"op":60,"w":200,"h":200,"nm":"orb","ddd":0,"assets":[],"layers":[{"ddd":0,"ind":1,"ty":4,"nm":"c","sr":1,"ks":{"o":{"a":0,"k":100},"r":{"a":1,"k":[{"i":{"x":[0.833],"y":[0.833]},"o":{"x":[0.167],"y":[0.167]},"t":0,"s":[0]},{"t":60,"s":[360]}]},"p":{"a":0,"k":[100,100,0]},"a":{"a":0,"k":[0,0,0]},"s":{"a":0,"k":[100,100,100]}},"ao":0,"shapes":[{"ty":"el","p":{"a":0,"k":[0,0]},"s":{"a":0,"k":[80,80]}},{"ty":"fl","c":{"a":0,"k":[0.608,0.349,1,1]},"o":{"a":0,"k":100}}],"ip":0,"op":60,"st":0,"bm":0}]}'
          [ ! -f app/src/main/assets/ayra_orb.json ]    && echo "$LOTTIE" > app/src/main/assets/ayra_orb.json
          [ ! -f app/src/main/assets/ayra_splash.json ] && echo "$LOTTIE" > app/src/main/assets/ayra_splash.json

      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AYRA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Done
        run: |
          echo "✅ AYRA APK Build সফল!"
          ls -lh app/build/outputs/apk/debug/
