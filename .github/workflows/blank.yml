
name: 🤖 AYRA Auto Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Unzip & Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. Find ZIP and extract ───────────────────────────────
      - name: 📦 Find & Extract ZIP
        run: |
          echo "=== Looking for ZIP file ==="
          find . -name "*.zip" | head -5

          ZIP=$(find . -name "*.zip" | grep -v ".git" | head -1)

          if [ -z "$ZIP" ]; then
            echo "❌ No ZIP found!"
            exit 1
          fi

          echo "✅ Found ZIP: $ZIP"
          mkdir -p /tmp/ayra_extracted
          unzip -o "$ZIP" -d /tmp/ayra_extracted/

          echo "=== Extracted contents ==="
          ls /tmp/ayra_extracted/

          # Find build.gradle (root of Android project)
          ROOT=$(find /tmp/ayra_extracted -name "build.gradle" -not -path "*/app/*" | head -1 | xargs dirname)
          echo "=== Android project root: $ROOT ==="

          # Copy project files to workspace
          cp -r "$ROOT"/. $GITHUB_WORKSPACE/
          echo "=== Workspace after copy ==="
          ls $GITHUB_WORKSPACE/

      # ── 3. JDK 17 ─────────────────────────────────────────────
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 4. Gradle cache ───────────────────────────────────────
      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 5. Lottie placeholder ─────────────────────────────────
      - name: 🎨 Create Lottie Assets
        run: |
          mkdir -p app/src/main/assets
          LOTTIE='{"v":"5.5.7","fr":30,"ip":0,"op":60,"w":200,"h":200,"nm":"orb","ddd":0,"assets":[],"layers":[{"ddd":0,"ind":1,"ty":4,"nm":"c","sr":1,"ks":{"o":{"a":0,"k":100},"r":{"a":1,"k":[{"i":{"x":[0.833],"y":[0.833]},"o":{"x":[0.167],"y":[0.167]},"t":0,"s":[0]},{"t":60,"s":[360]}]},"p":{"a":0,"k":[100,100,0]},"a":{"a":0,"k":[0,0,0]},"s":{"a":0,"k":[100,100,100]}},"ao":0,"shapes":[{"ty":"el","p":{"a":0,"k":[0,0]},"s":{"a":0,"k":[80,80]}},{"ty":"fl","c":{"a":0,"k":[0.608,0.349,1,1]},"o":{"a":0,"k":100}}],"ip":0,"op":60,"st":0,"bm":0}]}'
          [ ! -f app/src/main/assets/ayra_orb.json ]    && echo "$LOTTIE" > app/src/main/assets/ayra_orb.json
          [ ! -f app/src/main/assets/ayra_splash.json ] && echo "$LOTTIE" > app/src/main/assets/ayra_splash.json

      # ── 6. gradlew permission ─────────────────────────────────
      - name: 🔧 Fix gradlew
        run: chmod +x gradlew

      # ── 7. Build APK ──────────────────────────────────────────
      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"

      # ── 8. Upload APK ─────────────────────────────────────────
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AYRA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Done
        run: |
          echo "✅ AYRA APK Build সফল!"
          echo "👉 Actions → AYRA-APK → Download করুন"
          ls -lh app/build/outputs/apk/debug/
